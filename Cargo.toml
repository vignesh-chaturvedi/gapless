[workspace]
resolver = "3"
members = ["crates/gapless", "crates/gapless-verify", "crates/gapless-server", "tools/probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
solami = { version = "0.1.58", default-features = false, features = ["grpc"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "zstd", "gzip"] }
tokio-stream = "0.1"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
bs58 = "0.5"
thiserror = "2"
fastrand = "2"
zstd = "0.13"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gapless = { path = "crates/gapless" }
gapless-verify = { path = "crates/gapless-verify" }
