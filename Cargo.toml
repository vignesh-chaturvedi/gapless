[workspace]
resolver = "3"
members = ["crates/gapless", "tools/probe"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
solami = { version = "0.1.58", default-features = false, features = ["grpc"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "zstd", "gzip"] }
tokio-stream = "0.1"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
bs58 = "0.5"
thiserror = "2"
fastrand = "2"
gapless = { path = "crates/gapless" }
